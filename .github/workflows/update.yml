# 每天自动抓取，并把“科技前沿日报”发布到 GitHub Pages。
#
# 首次使用（只需一次）：
#   1. 仓库 Settings → Pages → Build and deployment → Source 选 “GitHub Actions”
#   2. 仓库 Actions → 左侧选 “Update and publish” → Run workflow
#
# 说明：
#   - main 分支只放代码，本工作流不会改动它。
#   - 累积数据（近 10 天的条目）存放在 data 分支的 store.json 里，每次运行整体覆盖，
#     所以仓库不会越来越大。删掉 data 分支只会丢失历史累积，下次运行会从头开始。
#   - 改了 config.py / index.html 之后想立即生效：到 Actions 页手动 Run workflow；
#     否则等下一次定时运行。
#   - 某次运行失败后想补跑：同样到 Actions 页点 Run workflow，发起一次新的运行。
#     不要点失败记录里的 “Re-run jobs”：据 actions/deploy-pages#451 里的报告，那样会再上传
#     一份同名的站点文件，发布时会因为 “Multiple artifacts” 再次失败。

name: Update and publish

on:
  schedule:
    # 23:17 UTC = 北京时间次日 07:17，这只是“最早”时间：GitHub 的定时触发会延迟，
    # 本仓库 2026-11-16 至 11-25 的 10 次定时运行实际开始于北京时间 10:48–14:58。
    # 避开整点可以少排队。想改时间就改这一行（注意写的是 UTC）。
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 把累积数据推送到 data 分支
  pages: write      # 发布到 GitHub Pages
  id-token: write   # 发布时的身份校验（deploy-pages 需要）

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      # 发布最多尝试 4 次（见文件末尾），这里取其中成功的那一次给出的地址
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry1.outputs.page_url || steps.deploy_retry2.outputs.page_url || steps.deploy_retry3.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # 放在最前面：Pages 还没启用时立刻报错，而不是抓取完才失败
      - name: Check GitHub Pages settings
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore accumulated data from the data branch
        run: |
          mkdir -p data
          status=0
          git ls-remote --exit-code origin refs/heads/data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --quiet --depth=1 origin refs/heads/data
            git show FETCH_HEAD:store.json > data/store.json
            echo "Restored store.json ($(wc -c < data/store.json) bytes)"
          elif [ "$status" -eq 2 ]; then
            echo "No data branch yet: starting from scratch"
          else
            echo "::error::Could not read the data branch (git ls-remote exit code $status)"
            exit 1
          fi

      - name: Fetch feeds and build page data
        env:
          TZ: Asia/Shanghai
        run: python update.py

      # 用一个没有历史的单独提交覆盖 data 分支
      - name: Save accumulated data to the data branch
        run: |
          blob="$(git hash-object -w data/store.json)"
          tree="$(printf '100644 blob %s\tstore.json\n' "$blob" | git mktree)"
          commit="$(git -c user.name='github-actions[bot]' \
                        -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                        commit-tree "$tree" -m "Accumulated data, $(date -u +'%Y-%m-%d %H:%M UTC')")"
          git push --quiet --force origin "$commit:refs/heads/data"

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/news.js _site/data/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # 刚上传的站点文件要过一会儿才能被发布步骤查到（GitHub 侧尚未修复的问题，见
      # actions/deploy-pages#451）。紧接着发布，有时会报 No artifacts named "github-pages"：
      # 本仓库 11-19、11-22、11-24、11-25 四次失败都是这个原因。该问题里别人实测，这段延迟
      # 通常在 6 秒以内，有一次长达 46 秒。
      # 所以先等 10 秒再发布；仍然失败就等更久再试，一共最多 4 次（上传后约 10 / 30 / 80 / 170 秒），
      # 最后一次也失败，整个任务才算失败。查不到文件时发布还没有开始创建，所以重试是安全的。
      - name: Wait for the uploaded site to become visible
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry 1
        if: steps.deploy.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry 1)
        id: deploy_retry1
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry 2
        if: steps.deploy_retry1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry 2)
        id: deploy_retry2
        if: steps.deploy_retry1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry 3
        if: steps.deploy_retry2.outcome == 'failure'
        run: sleep 90

      # 最后一次不加 continue-on-error：4 次都失败时，任务才显示为失败
      - name: Deploy to GitHub Pages (retry 3, last attempt)
        id: deploy_retry3
        if: steps.deploy_retry2.outcome == 'failure'
        uses: actions/deploy-pages@v5
